<!doctype html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Login</title>
    <link rel="icon" href="Bild.png">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

</head>
<body>

<nav th:replace="navbar :: navbar"></nav>

<div class="container d-flex justify-content-center my-5">
    <div class="card auth-card shadow-lg p-4">
        <h3 class="text-center">Registrera ny kund</h3>
        <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>
        <form th:action="@{/register}" th:object="${customer}" method="post" novalidate>
            <div class="mb-3">
                <label for="name" class="form-label">Namn</label>
                <input id="name" type="text" th:field="*{name}"
                       class="form-control theme-input"
                       th:classappend="${#fields.hasErrors('name')}? ' is-invalid'">
                <div class="invalid-feedback d-block"
                     th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Adress</label>
                <input id="address" type="text" th:field="*{address}"
                       class="form-control theme-input"
                       th:classappend="${#fields.hasErrors('address')}? ' is-invalid'">
                <div class="invalid-feedback d-block"
                     th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Telefon</label>
                <input id="phone" type="tel" th:field="*{phone}"
                       class="form-control theme-input"
                       th:classappend="${#fields.hasErrors('phone')}? ' is-invalid'">
                <div class="invalid-feedback d-block"
                     th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-post</label>
                <input id="email" type="email" th:field="*{email}" required
                       class="form-control theme-input"
                       th:classappend="${#fields.hasErrors('email')}? ' is-invalid'">
                <div class="invalid-feedback d-block"
                     th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Lösenord</label>
                <input id="password" type="password" th:field="*{password}" required
                       class="form-control theme-input"
                       th:classappend="${#fields.hasErrors('password')}? ' is-invalid'">
                <div class="invalid-feedback d-block"
                     th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="mb-4">
                <label class="form-label d-block">Roll</label>
                <div class="btn-group w-100" role="group">
                    <input type="radio" class="btn-check" th:field="*{role}" value="user" id="roleUser" autocomplete="off">
                    <label class="btn role-btn w-50" for="roleUser">Användare</label>

                    <input type="radio" class="btn-check" th:field="*{role}" value="admin" id="roleAdmin" autocomplete="off">
                    <label class="btn role-btn w-50" for="roleAdmin">Admin</label>
                </div>
                <p class="error mt-2" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></p>
            </div>
            <button class="btn btn-primary w-100" type="submit">Skapa konto</button>
        </form>
        <p class="text-center mt-3 mb-0">
            Har du redan konto? <a th:href="@{/login}" class="link-accent">Logga in</a>
        </p>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

</body>
</html>
