<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Lägg till i varukorgen</title>
    <link rel="icon" href="Bild.png">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
</head>
<body>

<nav th:replace="navbar :: navbar"></nav>

<main class="container">
    <div class="card" style="max-width: 640px; margin: 0 auto;">
        <img th:src="${product.image}" th:alt="${product.title}" alt="Produktbild" loading="lazy" style="height: 300px;">
        <h1 th:text="${product.title}">Produkt</h1>
        <p th:text="${product.description}">Beskrivning</p>

        <p><span th:text="${product.price}">0.00</span> €</p>

        <div style="display:flex; gap:10px; justify-content:center;">
            <!-- Lägg i varukorg -->
            <a class="btn" th:href="@{|/orders/checkout?productId=${product.id}|}">Lägg order</a>
            <a class="btn" th:href="@{/products}">Tillbaka</a>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</body>
</html>
