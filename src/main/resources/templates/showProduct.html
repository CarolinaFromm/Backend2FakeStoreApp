<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Lägg till i varukorgen</title>
    <link rel="icon" href="Bild.png">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <a class="navbar-brand mx-auto fs-3" th:href="@{/products}">
            FakeStore Startsida
        </a>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/login}">Logga in</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/aboutUs}">Kontakta oss</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<main class="container">
    <div class="card" style="max-width: 640px; margin: 0 auto;">
        <img th:src="${product.image}" th:alt="${product.title}" alt="Produktbild" loading="lazy" style="height: 300px;">
        <h1 th:text="${product.title}">Produkt</h1>
        <p th:text="${product.description}">Beskrivning</p>

        <p><span th:text="${product.price}">0.00</span> €</p>

        <div style="display:flex; gap:10px; justify-content:center;">
            <!-- Lägg i varukorg -->
            <a class="btn" th:href="@{/orders}">Lägg order</a>
            <a class="btn" th:href="@{/products}">Tillbaka</a>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</body>
</html>
