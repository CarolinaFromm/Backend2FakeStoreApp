<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Kontakta oss</title>
    <link rel="icon" href="Bild.png">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
</head>
<body>

<nav th:replace="navbar :: navbar"></nav>

<div class="container my-5">
    <div class="row justify-content-center g-4">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow rounded square-card">
                <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4068.5201966663426!2d18.02075517727271!3d59.345306009741634!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x465f9d9d263b022d%3A0x82fc0f30ed84f9ed!2sNackademin!5e0!3m2!1ssv!2sse!4v1744021556746!5m2!1ssv!2sse"
                        class="w-100 h-100"
                        style="border:0; border-radius: .5rem;"
                        allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow rounded square-card d-flex">
                <div class="card-body">
                    <br>
                    <h3 class="card-title mb-4">Kontakta oss</h3>
                    <h6>Hitta hit</h6>
                    <address>
                        Tomtebodavägen 3A<br>
                        171 65 Solna
                    </address>
                    <h6 class="mt-4">Kontaktuppgifter</h6>
                    <p>
                        +46 (0)70 123 12 345<br>
                        webshop@mail.com
                    </p>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow rounded square-card text-center">
                <div class="card-header github-header">
                    <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                         alt="GitHub" width="50" height="50">
                </div>
                <div class="card-body">
                    <ul class="list-unstyled m-0">
                        <li><a href="https://github.com/falafelsallad" target="_blank">github.com/falafelsallad</a></li>
                        <li><a href="https://github.com/EmilForzberg"  target="_blank">github.com/EmilForzberg</a></li>
                        <li><a href="https://github.com/ardianRama"    target="_blank">github.com/ardianRama</a></li>
                        <li><a href="https://github.com/CarolinaFromm" target="_blank">github.com/CarolinaFromm</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
<div class="mt-4">
    <a class="btn btn-primary" th:href="@{/products}">Tillbaka</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</body>
</html>
