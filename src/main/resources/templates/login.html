<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Login</title>
    <link rel="icon" href="Bild.png">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg custom-navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <a class="navbar-brand mx-auto fs-3 fw-bold" th:href="@{/products}">FakeStore</a>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav gap-3">
                <li class="nav-item">
                    <a class="nav-link hover-link" th:href="@{/login}">Logga in</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link hover-link" th:href="@{/aboutUs}">Kontakta oss</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<h1>Logga in</h1>

<div th:if="${param.registered}" style="color:green">Konto skapat! Du kan logga in.</div>
<div th:if="${param.error}" style="color:red">Fel e-post eller lösenord.</div>
<div th:if="${param.logout}" style="color:green">Du loggades utloggad.</div>

<form th:action="@{/login}" method="post" style="max-width:420px">
    <label>E-post</label>
    <input type="text" name="username" required>
    <label>Lösenord</label>
    <input type="password" name="password" required>
    <button class="btn" type="submit" style="margin-top:12px">Logga in</button>
</form>

<p style="margin-top:16px">Ny användare? <a th:href="@{/register}">Skapa konto</a></p>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</body>
</html>
