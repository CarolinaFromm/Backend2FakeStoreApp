<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Login</title>
    <link rel="icon" href="Bild.png">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

</head>
<body>

    <nav th:replace="~{navbar :: navbar}"></nav>

<div class="container d-flex justify-content-center my-5">
    <div class="card auth-card shadow-lg p-4">
        <div th:if="${param.registered}" class="alert alert-success">
            Konto skapat! Du kan logga in.
        </div>
        <div th:if="${param.error}" class="alert alert-danger">
            Fel e-post eller lösenord.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            Du loggades ut.
        </div>
        <h3 class="text-center mb-4">Logga in</h3>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">E-post</label>
                <input type="text" id="username" name="username" class="form-control theme-input" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Lösenord</label>
                <input type="password" id="password" name="password" class="form-control theme-input" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Logga in</button>
        </form>
        <p class="text-center mt-3">
            Ny användare? <a th:href="@{/register}">Skapa konto</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

</body>
</html>
