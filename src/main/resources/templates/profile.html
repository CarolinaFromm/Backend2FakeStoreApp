<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Mina ordrar</title>
    <link rel="icon" href="Bild.png">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

</head>
<body>

<nav th:replace="~{navbar :: navbar}"></nav>

<div class="container my-5">
    <div class="mt-4 mb-5">
        <a class="btn btn-primary" th:href="@{/products}">Tillbaka</a>
    </div>
    <div class="row row-cols-1 row-cols-md-2 g-4">
        <div class="col">
            <div class="card auth-card shadow-lg p-4">
                <h3 class="text-center">Kunduppgifter</h3>
                <p><strong>Namn:</strong> <span th:text="${currentCustomer.name}">Namn</span></p>
                <p><strong>E-post:</strong> <span th:text="${currentCustomer.email}">email</span></p>
                <p th:if="${currentCustomer.address}"><strong>Adress:</strong> <span th:text="${currentCustomer.address}">adress</span></p>
                <p th:if="${currentCustomer.phone}"><strong>Telefon:</strong> <span th:text="${currentCustomer.phone}">tele</span></p>
            </div>
        </div>
        <div class="col">
            <div class="card auth-card shadow-lg p-4">
                <h3 class="text-center">Mina ordrar</h3>
                <p th:if="${currentCustomer != null}">
                    Inloggad som <strong th:text="${currentCustomer.name}">Namn</strong>
                    (<span th:text="${currentCustomer.email}">epost</span>)
                </p>

                <div th:if="${#lists.isEmpty(orders)}">
                    Du har inga ordrar ännu.
                </div>

                <div th:if="${!#lists.isEmpty(orders)}" class="row row-cols-1 g-3">
                    <div class="col" th:each="o : ${orders}">
                        <div class="title" th:text="${o.product.title}">Produkt</div>
                        <p class="price" th:text="${o.product.price} + ' €'">0.00 €</p>
                        <p>Beställd: <span th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm')}">tid</span></p>
                        <hr>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

</body>
</html>
