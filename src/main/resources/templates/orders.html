<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Admin - Orders</title>
    <link rel="icon" href="Bild.png">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>

<div>
    <div class="container d-flex justify-content-center my-5">
        <div class="card authOrders-card shadow-lg p-4">
            <h3 class="text-center">Alla ordrar</h3>
            <p th:if="${currentCustomer != null}">
                Inloggad som <strong th:text="${currentCustomer.name}">Namn</strong>
                (<span th:text="${currentCustomer.email}">epost</span>)
            </p>

            <div th:if="${#lists.isEmpty(allOrders)}">
                Du har inga ordrar ännu.
            </div>

            <div th:if="${!#lists.isEmpty(allOrders)}" class="grid">
                <div class="card" th:each="o : ${allOrders}">
                    <div class="title" th:text="${o.product.title}">Produkt</div>
                    <p class="price" th:text="${o.product.price} + ' kr'">0.00 kr</p>
                    <p>Beställd: <span th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm')}">tid</span></p>
                    <form class="mt-2 d-inline"
                          th:action="@{/admin/delete/{id}(id=${o.id})}" method="post">
                        <button type="submit" class="btn btn-primary"
                                onclick="return confirm('Är du säker på att du vill ta bort ordern?');">Ta bort
                        </button>
                    </form>
                </div>
            </div>
            <div class="mt-4">
                <a class="btn btn-primary" th:href="@{/products}">Tillbaka</a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</body>
</html>
