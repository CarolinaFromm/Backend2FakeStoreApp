<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Produkter - Startsida</title>
    <link rel="icon" href="Bild.png">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>

<h1>Alla ordrar</h1>

<p th:if="${currentCustomer != null}">
    Inloggad som <strong th:text="${currentCustomer.name}">Namn</strong>
    (<span th:text="${currentCustomer.email}">epost</span>)
</p>

<div th:if="${#lists.isEmpty(allOrders)}">
    Det finns inga ordrar att titta på.
</div>

<div th:if="${!#lists.isEmpty(allOrders)}" class="grid">
    <div class="card" th:each="o : ${allOrders}">
        <div class="title" th:text="${o.product.title}">Produkt</div>
        <p class="price" th:text="${o.product.price} + ' kr'">0.00 kr</p>
        <p>Beställd: <span th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm')}">tid</span></p>
    </div>
</div>

<p style="margin-top:16px">
    <a class="nav-link" th:href="@{/products}">&larr; Till produkterna</a>
</p>
</body>
</html>
