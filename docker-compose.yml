services:
  db:
    image: postgres:17
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fakestore_admin -d FakeStoreDB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    environment:
      POSTGRES_USER: fakestore_admin
      POSTGRES_PASSWORD: fakestore_password
      POSTGRES_DB: FakeStoreDB
    ports:
      - "5234:5432"       # Default port 5432
